name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Runs on a Forgejo runner with the `docker` label. The toolchain is
# installed with rustup, so no action besides checkout is needed.
jobs:
  check:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: make check

  miri:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly --component miri
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo miri test --all-features --lib --tests
      - run: cargo miri test --all-features --doc
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks
