[package]
name = "vas"
version = "0.41.0"
edition = "2024"
description = "A collection of data containers, structures and algorithms for game development focused on speed and memory control."
license = "MIT"
repository = "https://github.com/qbart/vas"
homepage = "https://github.com/qbart/vas"
readme = "README.md"
keywords = ["gamedev", "no_std", "data-structures", "algorithms"]
categories = ["no-std", "game-development", "data-structures", "algorithms"]

[dependencies]

[features]
# Heap-backed blocks (`Arena::from_heap`, `arena::HeapBlock`) through the
# global allocator. Off by default; vas itself never allocates unless asked.
alloc = []

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "bench"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
